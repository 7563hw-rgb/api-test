<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMap 햅틱 내비게이션 V2</title>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=tWt4JKsKeJ1y7rYBPARVR5pdzwX3eLq5a2mFMx1P"></script>
    
    <script type="text/javascript">
        var map = null;
        var marker_s = null;
        var marker_e = null;
        var currentLat, currentLon;
        var destinationLat, destinationLon;
        
        // 경로 추적용 핵심 변수
        var drawInfoArr = []; 
        var resultdrawArr = [];
        var isNavigating = false;
        var currentWaypointIndex = 0; // 현재 내가 향하고 있는 경로 상의 '점' 번호
        
        var gpsLoop;

        // BLE 및 제어 변수
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        let myCharacteristic = null;
        let isHapticEnabled = true; // 진동 ON/OFF 상태

      // --- 블루투스 로직 (안정화 버전) ---
        async function connectBluetooth() {
            try {
                $("#ble_status").text("상태: 장치 검색 중...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Haptic_Belt' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                myCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                $("#ble_status").text("상태: 복대 연결 중... (통신 안정화)").css("color", "orange");
                
                // 💡 [핵심 수정] 연결 직후 통신이 완전히 열릴 때까지 500ms(0.5초) 대기
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // 확인 사살: 999(대기 신호)를 0.2초 간격으로 3번 연속 발사하여 무조건 침묵시킴
                for(let i=0; i<3; i++) {
                    await sendTargetAngleToBelt(999);
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
                
                $("#ble_status").text("상태: 복대 연결 완료! (🟢)").css("color", "green");
                $("#target_angle_info").text("연결됨: 길찾기를 시작하면 안내를 시작합니다.");
            } catch (error) {
                $("#ble_status").text("상태: 연결 실패").css("color", "red");
                console.error(error);
            }
        }
        async function sendTargetAngleToBelt(angle) {
            if (!myCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                await myCharacteristic.writeValue(encoder.encode(angle.toString()));
            } catch (error) { console.error('전송 에러:', error); }
        }

        // --- 진동 수동 ON/OFF 토글 기능 ---
        function toggleHaptic() {
            isHapticEnabled = !isHapticEnabled;
            if (isHapticEnabled) {
                $("#toggleBtn").text("진동: ON").css("background-color", "#28a745");
            } else {
                $("#toggleBtn").text("진동: OFF").css("background-color", "#dc3545");
                sendTargetAngleToBelt(999); // ESP32로 킬 스위치 발사
                $("#target_angle_info").text("안내 중지: 진동 수동 OFF");
            }
        }

        // --- 수학 1: 지구 곡률을 고려한 두 좌표 간의 거리 계산 (미터 단위) ---
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            var R = 6371e3; 
            var p1 = lat1 * Math.PI/180;
            var p2 = lat2 * Math.PI/180;
            var dp = (lat2-lat1) * Math.PI/180;
            var dl = (lon2-lon1) * Math.PI/180;
            var a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // 미터(m) 반환
        }

        // --- 수학 2: 방위각 계산 ---
        function calculateBearing(lat1, lon1, lat2, lon2) {
            var dLon = (lon2 - lon1) * Math.PI / 180;
            lat1 = lat1 * Math.PI / 180;
            lat2 = lat2 * Math.PI / 180;
            var y = Math.sin(dLon) * Math.cos(lat2);
            var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (Math.round(Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
        }

        // --- GPS 갱신 및 경로 추적 로직 ---
        function initTmap() {
            map = new Tmapv2.Map("map_div", { center : new Tmapv2.LatLng(37.562593, 126.992436), width : "100%", height : "400px", zoom : 17 });
            if (navigator.geolocation) { fetchGPS(); gpsLoop = setInterval(fetchGPS, 2000); }
        }

        function fetchGPS() { navigator.geolocation.getCurrentPosition(successCallback, errorCallback, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }); }

        function successCallback(position) {
            currentLat = position.coords.latitude;
            currentLon = position.coords.longitude;
            var myLatLng = new Tmapv2.LatLng(currentLat, currentLon);

            if (!map) return;
            if (marker_s == null) { marker_s = new Tmapv2.Marker({ position: myLatLng, map: map }); } 
            else { marker_s.setPosition(myLatLng); }
            map.setCenter(myLatLng);

            // 💡 경로 이탈 확인
            if (isNavigating && drawInfoArr.length > 0) {
                if (isOutOfPath(currentLat, currentLon, drawInfoArr)) {
                    console.log("경로 이탈. 재탐색...");
                    findRoute(destinationLon, destinationLat); 
                    return; // 재탐색 중에는 아래 방향 로직 패스
                }
            }

            // 💡 [핵심] 동적 웨이포인트 추적 알고리즘
            if (isNavigating && myCharacteristic && isHapticEnabled && drawInfoArr.length > 0) {
                
                // 1. 내가 타겟 점에 8미터 이내로 도착했으면 다음 점으로 타겟 변경
                while (currentWaypointIndex < drawInfoArr.length) {
                    var targetPt = drawInfoArr[currentWaypointIndex];
                    var dist = getDistanceInMeters(currentLat, currentLon, targetPt._lat, targetPt._lng);
                    
                    if (dist < 8) { // 8m 반경 도착 판정
                        currentWaypointIndex++;
                    } else {
                        break; // 아직 도착 안 했으면 거기를 계속 가리킴
                    }
                }

                // 2. 가리킬 점이 남아있다면 방위각 발사
                if (currentWaypointIndex < drawInfoArr.length) {
                    var finalTarget = drawInfoArr[currentWaypointIndex];
                    var targetAngle = calculateBearing(currentLat, currentLon, finalTarget._lat, finalTarget._lng);
                    
                    sendTargetAngleToBelt(targetAngle);
                    $("#target_angle_info").text(`경로 추적 중: 앞쪽 ${Math.round(getDistanceInMeters(currentLat, currentLon, finalTarget._lat, finalTarget._lng))}m 타겟 (${targetAngle}°)`);
                } 
                // 3. 배열이 끝났다 = 최종 목적지 도착
                else {
                    sendTargetAngleToBelt(999);
                    $("#target_angle_info").text("🚩 최종 목적지 도착 완료! (진동 종료)");
                    isNavigating = false;
                }
            }
        }

        function errorCallback(error) { console.log("GPS 에러"); }

        function isOutOfPath(lat, lon, pathArr) {
            var threshold = 0.0003;
            var minDistance = Number.MAX_VALUE;
            for (var i = 0; i < pathArr.length; i++) {
                var dist = Math.sqrt(Math.pow(lat - pathArr[i]._lat, 2) + Math.pow(lon - pathArr[i]._lng, 2));
                if (dist < minDistance) minDistance = dist;
            }
            return minDistance > threshold;
        }

        function searchKeyword() {
            var keyword = $('#searchKeyword').val();
            if (!keyword) return;
            $.ajax({
                method: "GET", headers: { "appKey": "tWt4JKsKeJ1y7rYBPARVR5pdzwX3eLq5a2mFMx1P" },
                url: "https://apis.openapi.sk.com/tmap/pois?version=1&format=json",
                data: { "searchKeyword": keyword, "resCoordType": "EPSG3857", "reqCoordType": "WGS84GEO", "centerLon": currentLon, "centerLat": currentLat, "count": 10 },
                success: function (response) {
                    var pois = response.searchPoiInfo.pois.poi;
                    var resHtml = "";
                    if (pois.length === 0) return;
                    for (var i in pois) {
                        var pLat = Number(pois[i].noorLat), pLon = Number(pois[i].noorLon);
                        var point = new Tmapv2.Point(pLon, pLat);
                        var conv = new Tmapv2.Projection.convertEPSG3857ToWGS84GEO(point);
                        resHtml += `<li style='margin-bottom: 10px;'><strong>${pois[i].name}</strong><br><button onclick='startNav(${conv._lng}, ${conv._lat})'>길찾기</button></li>`;
                    }
                    $("#searchResult").html(resHtml);
                }
            });
        }

        function startNav(lon, lat) {
            destinationLon = lon; destinationLat = lat;
            isNavigating = true;
            findRoute(lon, lat);
        }

        function findRoute(endLon, endLat) {
            if (marker_e) marker_e.setMap(null);
            marker_e = new Tmapv2.Label({ position: new Tmapv2.LatLng(endLat, endLon), content: "<div style='background:red; color:white; padding:5px;'>도착지</div>", map: map });
            $.ajax({
                method : "POST", headers : { "appKey": "tWt4JKsKeJ1y7rYBPARVR5pdzwX3eLq5a2mFMx1P" },
                url : "https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json",
                data : { "startX" : currentLon.toString(), "startY" : currentLat.toString(), "endX" : endLon.toString(), "endY" : endLat.toString(), "reqCoordType" : "WGS84GEO", "resCoordType" : "EPSG3857", "startName" : "출발", "endName" : "도착" },
                success : function(response) {
                    var features = response.features;
                    if (resultdrawArr.length > 0) { for (var i in resultdrawArr) resultdrawArr[i].setMap(null); resultdrawArr = []; }
                    drawInfoArr = [];
                    currentWaypointIndex = 0; // 💡 새로운 길을 찾을 때마다 타겟 점을 0번(처음)으로 초기화

                    for (var i in features) {
                        var geom = features[i].geometry;
                        if (geom.type == "LineString") {
                            for (var j in geom.coordinates) {
                                var pt = new Tmapv2.Point(geom.coordinates[j][0], geom.coordinates[j][1]);
                                var cv = new Tmapv2.Projection.convertEPSG3857ToWGS84GEO(pt);
                                drawInfoArr.push(new Tmapv2.LatLng(cv._lat, cv._lng));
                            }
                        }
                    }
                    var polyline = new Tmapv2.Polyline({ path : drawInfoArr, strokeColor : "#FF0000", strokeWeight : 6, map : map });
                    resultdrawArr.push(polyline);
                }
            });
        }
    </script>
</head>
<body onload="initTmap();" style="margin: 0; padding: 10px; font-family: sans-serif;">
    
    <div style="background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd;">
        <h3 style="margin-top: 0;">햅틱 내비게이션 제어</h3>
        <!-- 연결 버튼 -->
        <button onclick="connectBluetooth()" style="padding: 10px; font-weight: bold; background-color: #007bff; color: white; border: none; border-radius: 5px;">블루투스 복대 페어링</button>
        <!-- 💡 새로 추가된 ON/OFF 토글 버튼 -->
        <button id="toggleBtn" onclick="toggleHaptic()" style="padding: 10px; font-weight: bold; background-color: #28a745; color: white; border: none; border-radius: 5px; margin-left: 10px;">진동: ON</button>
        
        <span id="ble_status" style="margin-left: 10px; font-weight: bold;">상태: 대기 중</span>
        <br>
        <span id="target_angle_info" style="color: #d35400; font-weight: bold; margin-top: 10px; display: inline-block;">대기 중</span>
    </div>

    <div style="padding-bottom: 10px;">
        <input type="text" id="searchKeyword" placeholder="장소, 주소 검색" style="padding: 5px; width: 200px;">
        <button onclick="searchKeyword()" style="padding: 5px 10px;">검색</button>
    </div>

    <div style="display:flex;">
        <ul id="searchResult" style="width:30%; height:400px; overflow:auto; margin: 0; padding-left: 20px;"></ul>
        <div id="map_div" style="width: 70%; position: relative; border: 1px solid #ddd;"></div>
    </div>

</body>
</html>
